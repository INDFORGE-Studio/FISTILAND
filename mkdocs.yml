            Join: Unirse
            Admin: Administración
            Maps: Mapas
            Mushrooms: Setas
        - locale: it
          name: Italiano
          build: true
          nav_translations:
            Home: Home
            Server settings: Impostazioni del server
            Overview: Panoramica
            Territory: Territorio
            Respawn: Respawn
            Economy: Economia
            Progression: Progressione
            Survival: Sopravvivenza
            Enemies: Nemici
            Events: Eventi
            Bunkers: Bunker
