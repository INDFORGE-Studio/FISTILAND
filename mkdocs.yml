            Server settings: Налаштування сервера
            Overview: Огляд
            Territory: Територія
            Respawn: Відродження
            Economy: Економіка
            Progression: Прогрес
            Survival: Виживання
            Enemies: Вороги
            Events: Події
            Bunkers: Бункери
            Rules: Правила
            All settings: Усі налаштування
