site_name: FISTILAND
site_description: FISTILAND, EU PvP SCUM server built around territory wars. Loot x5, fast respawns, easier survival, no mechs.
site_url: https://indforge-studio.github.io/FISTILAND/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    scheme: slate
    primary: custom
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/fistiland-v8.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/UdHGdRSyyu
      name: FISTILAND on Discord

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Overview: Aperçu
            Territory wars: Guerre de territoires
            Survival: Survie
            Join: Rejoindre
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Start
            Overview: Überblick
            Territory wars: Territorialkriege
            Survival: Überleben
            Join: Beitreten
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Overview: Resumen
            Territory wars: Guerra de territorios
            Survival: Supervivencia
            Join: Unirse
        - locale: it
          name: Italiano
          build: true
          nav_translations:
            Home: Home
            Overview: Panoramica
            Territory wars: Guerre territoriali
            Survival: Sopravvivenza
            Join: Entra
        - locale: uk
          name: Українська
          build: true
          nav_translations:
            Home: Головна
            Overview: Огляд
            Territory wars: Війни за територію
            Survival: Виживання
            Join: Приєднатися

nav:
  - Home: index.md
  - Overview: server/overview.md
  - Territory wars: server/territory-wars.md
  - Survival: server/survival.md
  - Join: join.md
