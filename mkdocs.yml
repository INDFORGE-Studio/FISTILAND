site_name: FISTILAND SCUM SERVER
site_description: FISTILAND, EU PvP SCUM server built around territory wars. Loot x5, fast respawns, easier survival, no mechs.
site_url: https://indforge-studio.github.io/FISTILAND/

theme:
  name: material
  logo: assets/logo-header-v5.png
  favicon: assets/favicon-v5.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    scheme: slate
    primary: custom
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

extra_javascript:
  - javascripts/fl-copy-v4.js
  - javascripts/fl-map-v5.js

extra_css:
  - stylesheets/fistiland-v36.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/RHkNGk6ZQN
      name: FISTILAND on Discord

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Server settings: Réglages du serveur
            Overview: Aperçu
            Territory: Territoire
            Respawn: Respawn
            Economy: Économie
            Progression: Progression
            Survival: Survie
            Enemies: Ennemis
            Events: Événements
            Bunkers: Bunkers
            Rules: Règles
            All settings: Tous les réglages
            Join: Rejoindre
            Admin: Admin
            Maps: Cartes
            Mushrooms: Champignons
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Start
            Server settings: Servereinstellungen
            Overview: Überblick
            Territory: Gebiet
            Respawn: Respawn
            Economy: Wirtschaft
            Progression: Fortschritt
            Survival: Überleben
            Enemies: Gegner
            Events: Ereignisse
            Bunkers: Bunker
            Rules: Regeln
            All settings: Alle Einstellungen
            Join: Beitreten
            Admin: Admin
            Maps: Karten
            Mushrooms: Pilze
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Server settings: Ajustes del servidor
            Overview: Resumen
            Territory: Territorio
            Respawn: Reaparición
            Economy: Economía
            Progression: Progresión
            Survival: Supervivencia
            Enemies: Enemigos
