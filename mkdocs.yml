site_name: FISTILAND
site_description: FISTILAND, EU PvP SCUM server built around territory wars. Loot x5, fast respawns, easier survival, no mechs.
site_url: https://indforge-studio.github.io/FISTILAND/

theme:
  name: material
  logo: assets/logo-small.png
  favicon: assets/logo-small.png
  font:
    text: Inter
    code: Roboto Mono
  palette:
    scheme: slate
    primary: custom
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/fistiland-v18.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/UdHGdRSyyu
      name: FISTILAND on Discord

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
