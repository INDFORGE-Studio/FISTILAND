site_name: FISTILAND
site_description: FISTILAND, EU PvP SCUM server built around territory wars. Loot x5, fast respawns, easier survival, no mechs.
site_url: https://indforge-studio.github.io/FISTILAND/
repo_url: https://github.com/INDFORGE-Studio/FISTILAND
repo_name: INDFORGE-Studio/FISTILAND

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    scheme: slate
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/UdHGdRSyyu
      name: FISTILAND on Discord

nav:
  - Home: index.md
  - Server:
      - Overview: server/overview.md
      - Territory wars: server/territory-wars.md
      - Survival and enemies: server/survival.md
  - Join: join.md
