site_name: FISTILAND SCUM SERVER
site_description: FISTILAND, EU PvP SCUM server built around territory wars. Loot x5, fast respawns, easier survival, no mechs.
site_url: https://indforge-studio.github.io/FISTILAND/

theme:
  name: material
  custom_dir: overrides
  logo: assets/icon-192-v1.png
  favicon: assets/favicon-v9.ico
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_javascript:
  - javascripts/fl-copy-v6.js
  - javascripts/fl-map-v26.js
  - javascripts/fl-cards-v1.js
  - javascripts/fl-mush-v1.js
  - javascripts/fl-ip-v3.js
  - javascripts/fl-join-v3.js
  - javascripts/fl-discord-v4.js
  - javascripts/fl-cc-v11.js
  - javascripts/fl-rank-v15.js
  - javascripts/fl-theme-v8.js
  - javascripts/fl-fx-v4.js
  - javascripts/fl-trip-v2.js
  - javascripts/fl-lamp-v16.js
  - javascripts/fl-zone-v2.js

extra_css:
  - stylesheets/fl-fonts-v2.css
  - stylesheets/fistiland-v102.css
  - stylesheets/fl-skins-v5.css
  - stylesheets/fl-zone-v1.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/RHkNGk6ZQN
      name: FISTILAND on Discord

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
