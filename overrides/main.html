{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ base_url }}/assets/icon-32-v1.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ base_url }}/assets/icon-192-v1.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_url }}/assets/apple-touch-icon-v1.png">
  <meta name="theme-color" content="#ff6a00">
  <meta property="og:site_name" content="FISTILAND SCUM SERVER">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ config.site_url }}assets/icon-512-v1.png">
  <meta name="twitter:card" content="summary">
  <script>
    /* Veteran skin: applied before the first paint to avoid a flash. Same storage keys as fl-rank / fl-theme. */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('fl-eggs-5') || '{}');
        var t = localStorage.getItem('fl-theme');
        if (t && /^(survivalist|forces|demonic|zombie)$/.test(t) && s.discord && s.mushroom && s.master && s.veteran) {
          document.documentElement.setAttribute('data-fl-theme', t);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    /* Language memory: the language picked in the selector is kept in this browser and applied on the next visit,
       before the first paint. Cleared by the rank badge double-click (fl-rank). */
    (function () {
      try {
        var cur = (document.documentElement.lang || 'en').slice(0, 2);
        var want = localStorage.getItem('fl-lang');
        if (want && /^(en|fr|de|es|it|uk)$/.test(want) && want !== cur) {
          var a = document.querySelector('link[rel="alternate"][hreflang="' + want + '"]');
          if (a && a.href) { location.replace(a.href + location.search + location.hash); return; }
        }
        document.addEventListener('click', function (e) {
          var l = e.target && e.target.closest ? e.target.closest('.md-select__link[hreflang]') : null;
          if (l) { try { localStorage.setItem('fl-lang', l.getAttribute('hreflang')); } catch (x) {} }
        }, true);
      } catch (e) {}
    })();
  </script>
{% endblock %}
